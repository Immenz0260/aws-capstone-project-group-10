steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Debug EC2 Host
    run: echo "HOST=${{ secrets.EC2_HOST }}"

  - name: Deploy to EC2
    uses: appleboy/ssh-action@master
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ec2-user
      key: ${{ secrets.EC2_SSH_KEY }}
      script: |
        cd /var/www/html/aws-capstone-project-group-10
        git pull origin main